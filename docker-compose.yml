services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - studio-data:/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  studio-data:
